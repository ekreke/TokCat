name: Release Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Swift (Windows)
        uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.1-release
          swift-build: 6.1-RELEASE
          update-sdk-modules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build single-file exe
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          swift build -c release --product TokCatCli
          if ($LASTEXITCODE -ne 0) { Write-Host "::error title=win-cli::swift build failed"; exit 1 }
          $bin = (swift build -c release --product TokCatCli --show-bin-path).Trim()

          $payload = "windows/TokCat.Windows/Payload"
          New-Item -ItemType Directory -Force -Path $payload | Out-Null
          Copy-Item (Join-Path $bin "TokCatCli.exe") "$payload/TokCatCli.exe" -Force

          # Windows 上 Swift 运行时是动态库：一并打包（与 CLI 同目录）。
          $core = Get-ChildItem -Recurse -Filter swiftCore.dll -Path "$env:LOCALAPPDATA\Programs\Swift" -ErrorAction SilentlyContinue |
                  Select-Object -First 1
          if (-not $core) { Write-Host "::error title=win-runtime::swiftCore.dll not found"; exit 1 }
          Copy-Item "$($core.Directory.FullName)\*.dll" $payload -Force

          dotnet publish windows/TokCat.Windows/TokCat.Windows.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:Version=$env:VERSION -o build/win
          if ($LASTEXITCODE -ne 0) { Write-Host "::error title=win-publish::dotnet publish failed"; exit 1 }
          if (-not (Test-Path "build/win/TokCat.exe")) { Write-Host "::error title=win-singlefile::TokCat.exe missing"; exit 1 }

          # 冒烟：清空 PATH 后运行解压出的 CLI，确保产物自包含。
          $smoke = Join-Path $env:TEMP "tokcat-smoke"
          Remove-Item -Recurse -Force $smoke -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $smoke | Out-Null
          Copy-Item "$payload\*" $smoke -Force
          $oldPath = $env:PATH
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          & "$smoke\TokCatCli.exe" version
          $code = $LASTEXITCODE
          $env:PATH = $oldPath
          if ($code -ne 0) { Write-Host "::error title=win-smoke::TokCatCli.exe failed to run ($code)"; exit 1 }

          # 主产物：单文件 exe（稳定文件名，便于 releases/latest/download 直链）
          Copy-Item "build/win/TokCat.exe" "build/TokCat.exe" -Force
          # 备用：zip（含 exe + 使用说明）
          "下载后双击 TokCat.exe 运行；若出现 SmartScreen 提示，点「更多信息 → 仍要运行」。" |
            Out-File -Encoding utf8 "build/win/使用说明.txt"
          Compress-Archive -Path "build/win/*" -DestinationPath "build/TokCat-win-x64.zip" -Force

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/TokCat.exe
            build/TokCat-win-x64.zip
