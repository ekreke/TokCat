name: Release Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Swift (Windows)
        uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.1-release
          swift-build: 6.1-RELEASE
          update-sdk-modules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build portable bundle
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          swift build -c release --product TokCatCli --static-swift-stdlib
          if ($LASTEXITCODE -ne 0) { Write-Host "::error title=win-cli::static swift build failed"; exit 1 }
          $bin = (swift build -c release --product TokCatCli --show-bin-path).Trim()

          dotnet publish windows/TokCat.Windows/TokCat.Windows.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:Version=$env:VERSION -o build/win
          if ($LASTEXITCODE -ne 0) { Write-Host "::error title=win-publish::dotnet publish failed"; exit 1 }

          Copy-Item (Join-Path $bin "TokCatCli.exe") "build/win/TokCatCli.exe" -Force
          # 稳定文件名，便于 releases/latest/download 直链。
          Compress-Archive -Path "build/win/*" -DestinationPath "build/TokCat-win-x64.zip" -Force

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/TokCat-win-x64.zip
