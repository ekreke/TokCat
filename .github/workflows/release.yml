name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build DMG
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: ./Scripts/make-dmg.sh

      - name: Compute checksum
        id: sha
        run: |
          echo "sha256=$(shasum -a 256 "build/TokCat-${{ steps.ver.outputs.version }}.dmg" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/TokCat-${{ steps.ver.outputs.version }}.dmg

      - name: Update cask
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B cask-update origin/main
          perl -0pi -e 's/version "[^"]+"/version "'"$VERSION"'"/' Casks/tokcat.rb
          perl -0pi -e 's/sha256 "[0-9a-f]{64}"/sha256 "'"$SHA256"'"/' Casks/tokcat.rb
          git add Casks/tokcat.rb
          git diff --cached --quiet || git commit -m "chore(cask): tokcat ${VERSION}"
          git push origin HEAD:main
