name: CI

on:
  push:
    branches: [main, "feat/**", "spike/**", "fix/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # macOS：完整构建（含 AppKit/SwiftUI 外壳与测试）。
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain info
        run: |
          swift --version
          xcodebuild -version || true
      - name: Build all
        run: |
          set -o pipefail
          swift build 2>&1 | tee build-macos.log
      - name: Surface build errors (annotations)
        if: failure()
        run: |
          set +e
          block="$(grep -nE "error:" build-macos.log | head -40)"
          [ -n "$block" ] || block="$(tail -n 40 build-macos.log)"
          echo "::error::${block//$'\n'/%0A}"
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-log
          path: build-macos.log
      - name: Test
        run: swift test

  # Windows：验证共享层（Core/Sources/Agent）与常驻 CLI 的跨平台编译可行性（Spike A/F）。
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Swift (Windows)
        uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.1-release
          swift-build: 6.1-RELEASE
          update-sdk-modules: true
      - name: Swift version
        run: swift --version
      - name: Build shared CLI (no Apple-only deps)
        shell: bash
        run: |
          set +e
          swift build --product TokCatCli 2>&1 | tee build-win.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            msg=$(grep -iE "error|cannot|undefined|not found|no such|unable" build-win.log | head -25 | tr '\n' '~')
            echo "::error title=win-build::${msg}"
          fi
          exit $code
      - name: Test shared targets
        if: success()
        shell: bash
        run: |
          set +e
          swift test 2>&1 | tee test-win.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            msg=$(grep -iE "error|cannot|undefined|not found|no such|unable|failed" test-win.log | head -25 | tr '\n' '~')
            echo "::error title=win-test::${msg}"
          fi
          exit $code
      - name: Smoke test CLI dump
        if: success()
        shell: bash
        run: |
          set +e
          swift run TokCatCli dump 2>&1 | tee dump-win.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            msg=$(tail -n 30 dump-win.log | tr '\n' '~')
            echo "::error title=win-dump::${msg}"
          fi
          exit $code
      - name: Setup .NET
        if: success()
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Windows app (C#)
        if: success()
        shell: pwsh
        run: |
          dotnet build windows/TokCat.Windows/TokCat.Windows.csproj -c Release
          if ($LASTEXITCODE -ne 0) { Write-Host "::error title=win-app-build::C# build failed"; exit $LASTEXITCODE }
      - name: Publish portable bundle
        if: success()
        shell: pwsh
        run: |
          swift build -c release --product TokCatCli --static-swift-stdlib
          if ($LASTEXITCODE -ne 0) { Write-Host "::error title=win-cli-release::static swift build failed"; exit 1 }
          $bin = (swift build -c release --product TokCatCli --show-bin-path).Trim()
          dotnet publish windows/TokCat.Windows/TokCat.Windows.csproj -c Release -r win-x64 --self-contained true -o build/win
          if ($LASTEXITCODE -ne 0) { Write-Host "::error title=win-publish::dotnet publish failed"; exit 1 }
          Copy-Item (Join-Path $bin "TokCatCli.exe") "build/win/TokCatCli.exe" -Force
          Compress-Archive -Path "build/win/*" -DestinationPath "build/TokCat-win-x64.zip" -Force
      - name: Upload Windows artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TokCat-win-x64
          path: build/TokCat-win-x64.zip
