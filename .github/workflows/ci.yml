name: CI

on:
  push:
    branches: [main, "feat/**", "spike/**", "fix/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # macOS：完整构建（含 AppKit/SwiftUI 外壳与测试）。
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain info
        run: |
          swift --version
          xcodebuild -version || true
      - name: Build all
        run: |
          set -o pipefail
          swift build 2>&1 | tee build-macos.log
      - name: Test
        if: success()
        run: |
          set -o pipefail
          swift test 2>&1 | tee test-macos.log
      - name: Surface errors (annotations)
        if: failure()
        shell: bash
        run: |
          set +e
          block="$(cat build-macos.log test-macos.log 2>/dev/null | grep -nE "error:|failed|Fatal|Signal|Assertion|Crash" | head -40)"
          [ -n "$block" ] || block="$(tail -n 80 build-macos.log test-macos.log 2>/dev/null)"
          block="${block:0:3500}"
          echo "::error::${block//$'\n'/%0A}"
          exit 0
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-logs
          path: |
            build-macos.log
            test-macos.log

  # Windows：验证共享层（Core/Sources/Agent）与常驻 CLI 的跨平台编译可行性（Spike A/F）。
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Swift (Windows)
        uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.1-release
          swift-build: 6.1-RELEASE
          update-sdk-modules: true
      - name: Swift version
        run: swift --version
      - name: Build shared CLI (no Apple-only deps)
        shell: bash
        run: |
          set +e
          swift build --product TokCatCli 2>&1 | tee build-win.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            msg=$(grep -iE "error|cannot|undefined|not found|no such|unable" build-win.log | head -25 | tr '\n' '~')
            echo "::error title=win-build::${msg}"
          fi
          exit $code
      - name: Test shared targets
        if: success()
        shell: bash
        run: |
          set +e
          swift test 2>&1 | tee test-win.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            msg=$(grep -iE "error|cannot|undefined|not found|no such|unable|failed" test-win.log | head -25 | tr '\n' '~')
            echo "::error title=win-test::${msg}"
          fi
          exit $code
      - name: Smoke test CLI dump
        if: success()
        shell: bash
        run: |
          set +e
          swift run TokCatCli dump 2>&1 | tee dump-win.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            msg=$(tail -n 30 dump-win.log | tr '\n' '~')
            echo "::error title=win-dump::${msg}"
          fi
          exit $code
      - name: Setup .NET
        if: success()
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Windows app (C#)
        if: success()
        shell: pwsh
        run: |
          dotnet build windows/TokCat.Windows/TokCat.Windows.csproj -c Release
          if ($LASTEXITCODE -ne 0) { Write-Host "::error title=win-app-build::C# build failed"; exit $LASTEXITCODE }
      - name: Publish portable bundle (single exe)
        if: success()
        shell: pwsh
        run: |
          swift build -c release --product TokCatCli
          if ($LASTEXITCODE -ne 0) { Write-Host "::error title=win-cli-release::swift build failed"; exit 1 }
          $bin = (swift build -c release --product TokCatCli --show-bin-path).Trim()

          $payload = "windows/TokCat.Windows/Payload"
          New-Item -ItemType Directory -Force -Path $payload | Out-Null
          Copy-Item (Join-Path $bin "TokCatCli.exe") "$payload/TokCatCli.exe" -Force

          $core = Get-ChildItem -Recurse -Filter swiftCore.dll -Path "$env:LOCALAPPDATA\Programs\Swift" -ErrorAction SilentlyContinue |
                  Select-Object -First 1
          if (-not $core) { Write-Host "::error title=win-runtime::swiftCore.dll not found"; exit 1 }
          Copy-Item "$($core.Directory.FullName)\*.dll" $payload -Force

          dotnet publish windows/TokCat.Windows/TokCat.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o build/win
          if ($LASTEXITCODE -ne 0) { Write-Host "::error title=win-publish::dotnet publish failed"; exit 1 }
          if (-not (Test-Path "build/win/TokCat.exe")) { Write-Host "::error title=win-singlefile::TokCat.exe missing"; exit 1 }

          # 冒烟：清空 PATH 后运行解压出的 CLI，确保产物自包含（不依赖工具链）。
          $smoke = Join-Path $env:TEMP "tokcat-smoke"
          Remove-Item -Recurse -Force $smoke -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $smoke | Out-Null
          Copy-Item "$payload\*" $smoke -Force
          $oldPath = $env:PATH
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          & "$smoke\TokCatCli.exe" version
          $code = $LASTEXITCODE
          $env:PATH = $oldPath
          if ($code -ne 0) { Write-Host "::error title=win-smoke::TokCatCli.exe failed to run ($code)"; exit 1 }

          Compress-Archive -Path "build/win/*" -DestinationPath "build/TokCat-win-x64.zip" -Force
      - name: Upload Windows artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TokCat-win-x64
          path: build/TokCat-win-x64.zip
