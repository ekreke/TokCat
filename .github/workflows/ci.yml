name: CI

on:
  push:
    branches: [main, "feat/**", "spike/**", "fix/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # macOS：完整构建（含 AppKit/SwiftUI 外壳与测试）。
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain info
        run: |
          swift --version
          xcodebuild -version || true
      - name: Build all
        run: |
          set -o pipefail
          swift build 2>&1 | tee build-macos.log
      - name: Surface build errors (annotations)
        if: failure()
        run: |
          block="$(grep -nE "error:" build-macos.log | head -40)"
          [ -n "$block" ] || block="$(tail -n 40 build-macos.log)"
          echo "::error::${block//$'\n'/%0A}"
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-log
          path: build-macos.log
      - name: Test
        run: swift test

  # Windows：验证共享层（Core/Sources/Agent）与常驻 CLI 的跨平台编译可行性（Spike A/F）。
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Swift (Windows)
        uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.1-release
          swift-build: 6.1-RELEASE
          update-sdk-modules: true
      - name: Swift version
        run: swift --version
      - name: Build shared CLI (no Apple-only deps)
        shell: bash
        run: |
          set -o pipefail
          swift build --product TokCatCli 2>&1 | tee build-win.log
      - name: Test shared targets
        if: success()
        shell: bash
        run: |
          set -o pipefail
          swift test 2>&1 | tee test-win.log
      - name: Surface errors (annotations)
        if: failure()
        shell: bash
        run: |
          block="$(grep -nhE "error:|fatal error|cannot find|undefined|not found|failed" build-win.log test-win.log 2>/dev/null | head -40)"
          [ -n "$block" ] || block="$(tail -n 50 build-win.log test-win.log 2>/dev/null)"
          echo "::error::${block//$'\n'/%0A}"
      - name: Smoke test CLI dump
        if: success()
        run: swift run TokCatCli dump
